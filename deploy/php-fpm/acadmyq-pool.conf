; Dedicated PHP-FPM pool for the Laravel API.
; Install to: /etc/php/8.2/fpm/pool.d/acadmyq.conf  (remove the default www.conf or leave it)
; Runs as the unprivileged `acadmyq` user that owns /var/www/acadmyq.

[acadmyq]
user = acadmyq
group = acadmyq

listen = /run/php/php8.2-fpm-acadmyq.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Pass through env so artisan/runtime see production config
clear_env = no
catch_workers_output = yes
php_admin_value[error_log] = /var/log/php8.2-fpm-acadmyq.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
