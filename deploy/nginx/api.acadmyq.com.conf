# Laravel API — api.acadmyq.com
# Served by PHP-FPM (pool: acadmyq) from apps/api/public.
# Exact server_name wins over the wildcard web vhost, so API traffic lands here.

server {
    listen 80;
    listen [::]:80;
    server_name api.acadmyq.com;
    # ACME http-01 fallback (DNS-01 is primary for the wildcard); everything else → HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.acadmyq.com;

    root /var/www/acadmyq/apps/api/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/acadmyq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acadmyq.com/privkey.pem;

    client_max_body_size 25m;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm-acadmyq.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
