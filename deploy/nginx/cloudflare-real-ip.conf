# Restore the visitor's real IP behind Cloudflare.
#
# WHY THIS FILE EXISTS. Every acadmyq.com record is proxied (orange) in Cloudflare, so nginx
# accepts its TCP connections from a Cloudflare edge, not from the visitor. Without the rules
# below, `$remote_addr` — and therefore REMOTE_ADDR in PHP-FPM and X-Real-IP / X-Forwarded-For
# on the way to Next.js — is a Cloudflare IP for EVERY request on the platform.
#
# That silently defeats every per-IP control the application has: `throttle:60,1` on the public
# invoice pages, `throttle:120,1` on the learner site, the six-per-hour demo-request limiter,
# and the per-IP fallback of the WhatsApp API key limiter. They all end up counting one shared
# bucket per Cloudflare edge, which isolates nobody: a single abusive client consumes the budget
# of every real visitor routed through the same edge, and a brute-force attempt spread over a few
# edges is never throttled at all. Laravel's own audit trail records the edge IP too.
#
# `real_ip_header CF-Connecting-IP` is only honoured for connections coming FROM the ranges listed
# in `set_real_ip_from`, so this cannot be spoofed by someone reaching the origin directly: their
# own address stays the address nginx uses.
#
# MAINTENANCE: these are Cloudflare's published ranges (https://www.cloudflare.com/ips/). They
# change rarely; refresh them with `curl https://www.cloudflare.com/ips-v4` / `ips-v6` when
# Cloudflare announces a change. A missing range is fail-safe in the security sense (that edge's
# traffic keeps the edge IP, so limits are merely too strict), never fail-open.

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;
