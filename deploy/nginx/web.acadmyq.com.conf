# Next.js web — apex + app + every academy subdomain (*.acadmyq.com)
# Reverse-proxies to the `next start` server on 127.0.0.1:3000 (systemd: acadmyq-web).
# The wildcard catches each tenant subdomain; Next.js reads the Host header to resolve
# the academy. The exact api.acadmyq.com vhost takes priority over this wildcard.

server {
    listen 80;
    listen [::]:80;
    server_name acadmyq.com www.acadmyq.com app.acadmyq.com *.acadmyq.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name acadmyq.com www.acadmyq.com app.acadmyq.com *.acadmyq.com;

    ssl_certificate     /etc/letsencrypt/live/acadmyq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acadmyq.com/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;                 # tenant subdomain passed through
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }
}
