# Client custom domains — the catch-all vhost (docs/custom-domains)
#
# Everything that is NOT acadmyq.com. The exact `api.acadmyq.com` vhost and the
# `*.acadmyq.com` wildcard vhost both name their server_name, so nginx matches those
# first and this only ever sees a host a client pointed at us (or a stranger's probe,
# which the Next.js middleware 404s).
#
# TWO THINGS MAKE THIS WORK, and both are worth understanding before editing it.
#
# 1. A PER-HOST CERTIFICATE, CHOSEN AT HANDSHAKE TIME.
#    `ssl_certificate` takes variables (nginx >= 1.15.9; this box runs 1.24), so the
#    certificate is looked up by SNI from a flat directory instead of needing one
#    `server {}` block per client. Adding a domain is therefore TWO SYMLINKS AND NO
#    RELOAD — which is the whole reason custom domains cost nothing to run here.
#    The tradeoff is that nginx cannot cache a cert it resolves through a variable, so
#    it reads the file on every handshake; the session cache below is what keeps that
#    from mattering. `_fallback` catches a client sending no SNI, and a host whose
#    certificate has not been issued yet — a name-mismatch warning is a far better
#    failure than a refused handshake.
#
# 2. THE API IS SERVED FROM THE CLIENT'S OWN ORIGIN.
#    `portal.theirschool.com` and `api.acadmyq.com` share no registrable parent, so a
#    session cookie set by the latter is a third-party cookie on the former — dropped
#    by Safari outright, and sign-in simply never completes. Routing `/api` and
#    `/sanctum` here straight to PHP-FPM makes those calls same-origin, and the whole
#    Sanctum cookie flow works unchanged. `App\Providers\AppServiceProvider` is the
#    other half: it makes the session cookie host-only and marks this host stateful.
#
# Deliberately NO cloudflare-real-ip include: a custom domain must be DNS-only
# (a proxied record makes the ACME challenge unreachable), so traffic arrives direct
# and $remote_addr is already the visitor.

map $ssl_server_name $acadmyq_cert_dir {
    # No SNI, or something that is not a hostname → the platform's wildcard cert.
    default                      "_fallback";
    "~^(?<sni>[a-z0-9.-]+)$"     $sni;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME http-01 — this MUST be served before the redirect, or no certificate is ever
    # issued for any custom domain. Same webroot certbot is pointed at.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/$acadmyq_cert_dir/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/$acadmyq_cert_dir/privkey.pem;

    # Resumed sessions skip the handshake, and therefore skip the per-handshake disk
    # read the variable certificate above costs us.
    ssl_session_cache   shared:CUSTOMDOMAINS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25m;
    charset utf-8;

    # The API's docroot: PHP is the DEFAULT here and Next.js is the fallback, because
    # only the two prefixes below may reach PHP at all.
    root /var/www/acadmyq/apps/api/public;

    # Laravel, on the client's own origin. `^~` so these win over the regex location
    # below without it having to be consulted.
    location ^~ /api/     { try_files $uri /index.php?$query_string; }
    location ^~ /sanctum/ { try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm-acadmyq.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Everything else is the Next.js app, which reads the Host header and resolves the
    # client from it (apps/web/src/middleware.ts → GET /api/site).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;                 # the client's own domain, passed through
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
