name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Laravel API (Pint + Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql, pgsql, mbstring, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Provision RLS roles
        # Tests MUST connect as a NON-superuser, NON-BYPASSRLS role that owns the schema,
        # or FORCE ROW LEVEL SECURITY is skipped and isolation silently fails. The service
        # container's `postgres` user is a superuser (bypasses RLS), so create academiq_app
        # + academiq_rls_bypass and hand them ownership of the test database's schema.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d academiq_test -v ON_ERROR_STOP=1 <<'SQL'
            create role academiq_rls_bypass nologin bypassrls;
            create role academiq_app login password 'academiq' nosuperuser nobypassrls;
            grant academiq_rls_bypass to academiq_app;
            grant create on database academiq_test to academiq_app;
            alter schema public owner to academiq_app;
            grant create, usage on schema public to academiq_app;
          SQL

      - name: Pint (code style)
        run: ./vendor/bin/pint --test

      - name: Pest (tests, against PostgreSQL as the RLS app role)
        env:
          # Real env vars override the non-forced phpunit.xml values. Connect as the
          # NON-superuser app role so FORCE RLS is exercised; CI's host/port differ.
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: academiq_test
          DB_USERNAME: academiq_app
          DB_PASSWORD: academiq
          DB_RLS_BYPASS_ROLE: academiq_rls_bypass
        run: ./vendor/bin/pest

  web:
    name: Next.js (typecheck + lint + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web run typecheck

      - name: Lint
        run: pnpm --filter web run lint

      - name: Vitest
        run: pnpm --filter web run test
