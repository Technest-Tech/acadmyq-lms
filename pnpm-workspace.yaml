packages:
  - "apps/web"
  - "apps/wa-gateway"
  - "apps/desktop"
  - "packages/*"

# Dependency build scripts are blocked by default (pnpm 10/11). On a fresh install pnpm exits
# non-zero (ERR_PNPM_IGNORED_BUILDS) for any dependency whose build script is ignored but not
# explicitly acknowledged. `ignoredBuiltDependencies` is the real pnpm key for that
# acknowledgement (the old `allowBuilds` key was NOT a pnpm setting — it was a silent no-op, and
# fresh deploys only passed because these packages were already in the store). Each package below
# ships prebuilt binaries (or, for electron, a ~150 MB binary that CI/deploy never need), so we
# decline to build them and pnpm exits 0. Developers who actually run the desktop app fetch
# electron's binary locally with `pnpm --filter @academiq/desktop run rebuild:electron`
# (see apps/desktop/README).
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - core-js
  - sharp
  - unrs-resolver
  - baileys
  - esbuild
  - protobufjs
  - electron
