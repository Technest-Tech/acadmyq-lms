# AcademIQ media server — raise open-file limits for media workloads.
# Install as /etc/security/limits.d/99-academiq-nofile.conf
# (Docker containers also get explicit `ulimits: nofile` in docker-compose.yml.)
*     soft nofile 1048576
*     hard nofile 1048576
root  soft nofile 1048576
root  hard nofile 1048576
