# AcademIQ media — Prometheus scrape config.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# alerting: add an Alertmanager target here to route the rules in alerts.yml to email/Slack/etc.
# alerting:
#   alertmanagers:
#     - static_configs: [{ targets: ['127.0.0.1:9093'] }]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: livekit
    static_configs:
      - targets: ['127.0.0.1:6789']     # LiveKit prometheus_port
