# LiveKit Egress (recording) — LOCAL dev config. Records room composites to local MinIO.
log_level: info

redis:
  address: redis:6379

# Must match the key/secret in livekit.yaml
api_key: devkey
api_secret: devsecret_local_only_change_me_0123456789

ws_url: ws://livekit:7880
insecure: true                 # LOCAL ONLY — never in production

# Output to local MinIO (S3-compatible). On Hetzner this becomes Backblaze B2 / Wasabi.
s3:
  access_key: minioadmin
  secret: minioadmin
  bucket: recordings
  endpoint: http://minio:9000
  force_path_style: true       # required for MinIO
