# AcademIQ media server — kernel/network tuning for WebRTC (LiveKit SFU + coturn) at scale.
# Install as /etc/sysctl.d/99-livekit.conf ; apply with: sysctl --system
# Rationale: docs/video-platform/07-DEPLOYMENT.md §7.

# --- UDP socket buffers (Pion/WebRTC warns & drops packets if rmem_max is too small) ---
net.core.rmem_max = 26214400
net.core.wmem_max = 26214400
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.optmem_max = 25165824

# --- packet / accept backlogs ---
net.core.netdev_max_backlog = 65536
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 8192

# --- UDP memory pool (pages: min / pressure / max) ---
net.ipv4.udp_mem = 65536 131072 262144

# --- file descriptors (many concurrent media sockets) ---
fs.file-max = 2097152
fs.nr_open = 2097152

# --- connection tracking for many concurrent UDP media flows ---
net.netfilter.nf_conntrack_max = 1048576

# --- memory behaviour (2G swap present; prefer RAM, allow overcommit for headless Chrome / egress) ---
vm.swappiness = 10
vm.overcommit_memory = 1
