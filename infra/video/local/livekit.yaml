# LiveKit SFU — LOCAL dev config. Dev keys only; do not reuse in production.
port: 7880
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50019
  use_external_ip: false      # local/LAN dev (node IP is set via --node-ip in docker-compose)

redis:
  address: redis:6379

# api_key: api_secret  (the secret must be >= 32 chars)
keys:
  devkey: devsecret_local_only_change_me_0123456789

# Webhooks → the Laravel control plane (signed with the devkey secret; verified by
# VerifyLivekitWebhook). The URL must be reachable FROM this container; `host.docker.internal`
# resolves to the host on Docker Desktop, so run the API bound to 0.0.0.0:8000
# (`php artisan serve --host=0.0.0.0`). LOCAL ONLY — Hetzner config lives in infra/video/prod.
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:8000/api/internal/livekit/webhook

# No `turn:` block locally — a trusted LAN doesn't need a relay.
# TURN (with TLS, incl. TCP/443) is enabled on Hetzner — see 02-INFRASTRUCTURE.md Part B.
