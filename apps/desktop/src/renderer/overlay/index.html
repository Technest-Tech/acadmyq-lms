<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcademIQ overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent; /* the whole point — the desktop shows through */
        overflow: hidden;
        cursor: none;
      }
      #grid {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="grid"></canvas>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
