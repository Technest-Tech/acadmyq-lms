<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annotate</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #1e293b;
        --panel-hover: #334155;
        --border: rgba(148, 163, 184, 0.18);
        --emerald: #34d399;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --danger: #ef4444;
      }
      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: var(--text);
        font: 13px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      .bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        height: 100vh;
        padding: 6px 0;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        overflow-y: auto; /* never clip a control on a short screen */
        overflow-x: hidden;
        scrollbar-width: none;
      }
      .bar::-webkit-scrollbar {
        display: none;
      }
      .grip {
        width: 24px;
        height: 4px;
        border-radius: 999px;
        background: var(--panel-hover);
        margin: 0 0 3px;
        -webkit-app-region: drag; /* drag the toolbar by its handle */
        cursor: grab;
        flex: none;
      }
      button {
        all: unset;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        color: var(--text);
        cursor: pointer;
        transition:
          background 0.12s,
          color 0.12s,
          transform 0.06s;
        flex: none;
      }
      button:hover {
        background: var(--panel);
      }
      button:active {
        transform: scale(0.94);
      }
      button.tool.active {
        background: var(--emerald);
        color: #06281d;
      }
      button.danger:hover {
        background: rgba(239, 68, 68, 0.18);
        color: var(--danger);
      }
      button[disabled] {
        opacity: 0.35;
        pointer-events: none;
      }
      .sep {
        width: 26px;
        height: 1px;
        background: var(--border);
        margin: 3px 0;
        flex: none;
      }
      svg {
        width: 19px;
        height: 19px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .swatches {
        display: grid;
        grid-template-columns: repeat(2, 16px);
        justify-content: center;
        gap: 5px;
        padding: 1px 0;
        flex: none;
      }
      .swatch {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        /* a light outer ring so even the black/dark swatches stand out on the dark toolbar */
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3);
        transition: transform 0.06s;
      }
      .swatch:hover {
        transform: scale(1.12);
      }
      .swatch.active {
        border-color: #f8fafc;
        box-shadow: 0 0 0 2px var(--emerald);
      }
      .widths {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 3px 0;
        flex: none;
      }
      .wdot {
        background: var(--text);
        border-radius: 50%;
        cursor: pointer;
        opacity: 0.5;
        transition:
          opacity 0.12s,
          transform 0.06s;
      }
      .wdot:hover {
        transform: scale(1.15);
      }
      .wdot.active {
        opacity: 1;
        outline: 2px solid var(--emerald);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="grip" title="Drag"></div>

      <button class="tool" data-tool="select" title="Select / use your screen" aria-label="Select">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 7-6 1.5L11 18z" /></svg>
      </button>
      <button class="tool" data-tool="pen" title="Pen" aria-label="Pen">
        <svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8a2 2 0 0 0-3-3L5 16z" /><path d="M14 6l3 3" /></svg>
      </button>
      <button class="tool" data-tool="line" title="Line" aria-label="Line">
        <svg viewBox="0 0 24 24"><path d="M5 19L19 5" /></svg>
      </button>
      <button class="tool" data-tool="arrow" title="Arrow" aria-label="Arrow">
        <svg viewBox="0 0 24 24"><path d="M5 19L19 5" /><path d="M11 5h8v8" /></svg>
      </button>
      <button class="tool" data-tool="rectangle" title="Rectangle" aria-label="Rectangle">
        <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1" /></svg>
      </button>
      <button class="tool" data-tool="ellipse" title="Ellipse" aria-label="Ellipse">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6.5" /></svg>
      </button>
      <button class="tool" data-tool="eraser" title="Eraser" aria-label="Eraser">
        <svg viewBox="0 0 24 24"><path d="M16 17H8.5L4 12.5a1.5 1.5 0 0 1 0-2L11 4l7 7-5 6" /><path d="M8.5 8.5l7 7" /></svg>
      </button>

      <div class="sep"></div>

      <div class="swatches" id="swatches"></div>
      <div class="widths" id="widths"></div>

      <div class="sep"></div>

      <button id="undo" title="Undo" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5" /><path d="M4 12h11a5 5 0 0 1 0 10h-1" /></svg>
      </button>
      <button id="redo" title="Redo" aria-label="Redo">
        <svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5" /><path d="M20 12H9a5 5 0 0 0 0 10h1" /></svg>
      </button>
      <button id="clear" class="danger" title="Clear all" aria-label="Clear all">
        <svg viewBox="0 0 24 24"><path d="M4 7h16" /><path d="M9 7V4h6v3" /><path d="M6 7l1 13h10l1-13" /><path d="M10 11v6M14 11v6" /></svg>
      </button>

      <div class="sep"></div>

      <button id="close" class="danger" title="Close annotation" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
    <script type="module" src="./toolbar.ts"></script>
  </body>
</html>
