<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exit drawing mode</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font: 700 13.5px/1 -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      #exit {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border: none;
        border-radius: 26px;
        cursor: pointer;
        color: #fff;
        letter-spacing: 0.01em;
        background: linear-gradient(180deg, #fb7185, #e11d48);
        box-shadow:
          0 10px 26px rgba(225, 29, 72, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
        transition: filter 0.12s, transform 0.06s;
      }
      #exit:hover {
        filter: brightness(1.07);
      }
      #exit:active {
        transform: scale(0.98);
      }
      #exit svg {
        flex: 0 0 auto;
      }
    </style>
  </head>
  <body>
    <button id="exit" type="button" title="Exit drawing mode">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
      </svg>
      Exit drawing mode
    </button>
    <script type="module">
      // Reuses the toolbar bridge: "close" disarms annotation on the main process + flips the web
      // Annotate button off (the same path as the toolbar's X).
      document.getElementById("exit").addEventListener("click", () => {
        window.academiqToolbar?.action("close");
      });
    </script>
  </body>
</html>
