<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcademIQ — Join a meeting</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #060a14;
        --panel: rgba(17, 26, 46, 0.62);
        --border: rgba(148, 163, 184, 0.16);
        --border-strong: rgba(148, 163, 184, 0.28);
        --emerald: #34d399;
        --emerald-strong: #10b981;
        --text: #eef2f8;
        --muted: #97a6bd;
        --danger: #fca5a5;
        /* Clearance for the frameless window's native controls (macOS traffic lights top-left). */
        --safe-top: 46px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        color: var(--text);
        font: 15px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif;
        user-select: none;
        background: var(--bg);
        overflow: hidden;
      }

      /* ── Modern animated aurora background ─────────────────────────────────────────── */
      .aurora {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .aurora span {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.55;
        will-change: transform;
      }
      .b1 {
        width: 560px;
        height: 560px;
        top: -170px;
        left: -140px;
        background: radial-gradient(circle, #10b981 0%, transparent 68%);
        animation: drift1 20s ease-in-out infinite;
      }
      .b2 {
        width: 500px;
        height: 500px;
        bottom: -190px;
        right: -140px;
        background: radial-gradient(circle, #2563eb 0%, transparent 68%);
        animation: drift2 24s ease-in-out infinite;
      }
      .b3 {
        width: 400px;
        height: 400px;
        top: 42%;
        right: 24%;
        background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
        opacity: 0.4;
        animation: drift3 28s ease-in-out infinite;
      }
      @keyframes drift1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(70px, 50px) scale(1.08); }
      }
      @keyframes drift2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-60px, -50px) scale(1.1); }
      }
      @keyframes drift3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-50px, 40px) scale(0.92); }
      }
      /* Faint dotted grid + a soft vignette for depth, above the aurora. */
      .aurora::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px);
        background-size: 26px 26px;
        mask-image: radial-gradient(1100px 760px at 50% 32%, #000 0%, transparent 76%);
      }
      @media (prefers-reduced-motion: reduce) {
        .aurora span { animation: none; }
      }

      /* Draggable strip + safe area so the native traffic lights never overlap the card. */
      .dragbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--safe-top);
        -webkit-app-region: drag;
        z-index: 6;
      }
      .wrap {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: calc(var(--safe-top) + 12px) 24px 30px;
      }

      /* ── Brand / title ────────────────────────────────────────────────────────────── */
      .brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .brand::before {
        content: "";
        position: absolute;
        inset: -26px -40px;
        background: radial-gradient(closest-side, rgba(16, 185, 129, 0.2), transparent 75%);
        z-index: -1;
      }
      .brand .mark {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: linear-gradient(140deg, var(--emerald), var(--emerald-strong));
        box-shadow: 0 10px 24px rgba(16, 185, 129, 0.4);
        color: #04140d;
      }
      .brand .tag {
        font-size: 10.5px;
        font-weight: 700;
        color: var(--emerald);
        background: rgba(52, 211, 153, 0.12);
        border: 1px solid rgba(52, 211, 153, 0.32);
        border-radius: 999px;
        padding: 3px 9px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      /* ── Card ─────────────────────────────────────────────────────────────────────── */
      .card {
        position: relative;
        width: 100%;
        max-width: 430px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 30px 30px 28px;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(22px);
        overflow: hidden;
      }
      /* Gradient accent strip along the top edge of the card. */
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--emerald) 20%, #38bdf8 55%, #8b5cf6 85%, transparent);
        opacity: 0.85;
      }
      .card h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 750;
        letter-spacing: -0.015em;
        background: linear-gradient(100deg, #eef2f8, #a7f3d0 58%, #7dd3fc);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .card .sub {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 13.5px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin: 0 0 8px;
        letter-spacing: 0.01em;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border-radius: 13px;
        border: 1px solid var(--border-strong);
        background: rgba(7, 13, 26, 0.72);
        transition: border-color 0.14s, box-shadow 0.14s, background 0.14s;
      }
      .field:focus-within {
        border-color: rgba(52, 211, 153, 0.65);
        box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.14);
        background: rgba(7, 13, 26, 0.92);
      }
      .field svg {
        flex: 0 0 auto;
        color: var(--muted);
      }
      .field:focus-within svg {
        color: var(--emerald);
      }
      input {
        flex: 1 1 auto;
        width: 100%;
        padding: 14px 0;
        border: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        outline: none;
        user-select: text;
      }
      input::placeholder {
        color: #64748b;
      }
      .example {
        margin: 9px 2px 0;
        font-size: 12px;
        color: #64748b;
      }
      .example code {
        color: var(--muted);
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11.5px;
      }
      button.join {
        margin-top: 20px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 14px;
        border: none;
        border-radius: 13px;
        background: linear-gradient(140deg, var(--emerald), var(--emerald-strong));
        color: #04140d;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 12px 28px rgba(16, 185, 129, 0.3);
        transition: filter 0.14s, transform 0.06s, box-shadow 0.14s;
      }
      button.join:hover {
        filter: brightness(1.06);
        box-shadow: 0 16px 34px rgba(16, 185, 129, 0.4);
      }
      button.join:active {
        transform: translateY(1px) scale(0.995);
      }
      button.join:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        box-shadow: none;
      }
      /* Inline error banner — only rendered when it has a message (home.ts sets textContent). */
      .err {
        margin-top: 14px;
        font-size: 12.5px;
        color: var(--danger);
        display: none;
      }
      .err:not(:empty) {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 11px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.28);
      }
      .err:not(:empty)::before {
        content: "!";
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: rgba(239, 68, 68, 0.25);
        color: #fecaca;
        font-weight: 800;
        font-size: 11px;
      }
      .hint {
        margin: 0;
        font-size: 12px;
        color: #64748b;
        text-align: center;
        max-width: 380px;
      }
    </style>
  </head>
  <body>
    <div class="aurora">
      <span class="b1"></span>
      <span class="b2"></span>
      <span class="b3"></span>
    </div>
    <div class="dragbar"></div>

    <div class="wrap">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <rect x="2.5" y="6" width="12.5" height="12" rx="3" fill="currentColor" />
            <path d="M15.5 10.2l4.6-2.6c.7-.4 1.4.1 1.4.9v6.9c0 .8-.7 1.3-1.4.9l-4.6-2.6" fill="currentColor" />
          </svg>
        </span>
        AcademIQ <span class="tag">Teacher</span>
      </div>

      <div class="card">
        <h1>Join a meeting</h1>
        <p class="sub">Paste your meeting or host link to jump straight into the class.</p>

        <label for="meeting">Meeting link or code</label>
        <div class="field">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 15l6-6M10.5 6.5l1-1a4 4 0 015.7 5.7l-1 1M13.5 17.5l-1 1a4 4 0 01-5.7-5.7l1-1"
              stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <input
            id="meeting"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Paste meeting link, or enter a code"
          />
        </div>
        <p class="example">Example: <code>https://acadmyq.com/r/halaqa-k3p9x</code></p>

        <button class="join" id="join">
          Join meeting
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="err" id="err"></div>
      </div>

      <p class="hint">A meeting-only app — everything runs off the link. Your host link gives you full control &amp; annotation.</p>
    </div>
    <script type="module" src="./home.ts"></script>
  </body>
</html>
