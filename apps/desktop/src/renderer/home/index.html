<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcademIQ — Join a meeting</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1120;
        --panel: #111a2e;
        --border: rgba(148, 163, 184, 0.18);
        --emerald: #34d399;
        --emerald-strong: #10b981;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(1200px 600px at 50% -10%, #14233f 0%, var(--bg) 55%);
        color: var(--text);
        font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      .wrap {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .brand .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--emerald);
        box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.18);
      }
      .brand .tag {
        font-size: 11px;
        font-weight: 700;
        color: var(--emerald);
        background: rgba(52, 211, 153, 0.12);
        border: 1px solid rgba(52, 211, 153, 0.35);
        border-radius: 999px;
        padding: 2px 8px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 26px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 700;
      }
      .sub {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 13px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 11px;
        border: 1px solid var(--border);
        background: #0a1326;
        color: var(--text);
        font: inherit;
        outline: none;
        user-select: text;
      }
      input:focus {
        border-color: rgba(52, 211, 153, 0.6);
        box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15);
      }
      button.join {
        margin-top: 20px;
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 12px;
        background: var(--emerald-strong);
        color: #04140d;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        transition: background 0.12s, transform 0.06s;
      }
      button.join:hover {
        background: var(--emerald);
      }
      button.join:active {
        transform: scale(0.99);
      }
      button.join:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .err {
        margin-top: 10px;
        font-size: 12.5px;
        color: #fca5a5;
        min-height: 16px;
      }
      .foot {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .link {
        color: var(--emerald);
        font-weight: 600;
        background: none;
        border: none;
        cursor: pointer;
        font: inherit;
        padding: 0;
      }
      .link:hover {
        text-decoration: underline;
      }
      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
      /* Draggable strip so the frameless (macOS title-bar-hidden) window can still be moved. */
      .dragbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 34px;
        -webkit-app-region: drag;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div class="dragbar"></div>
    <div class="wrap">
      <div class="brand">
        <span class="dot"></span> AcademIQ <span class="tag">Teacher</span>
      </div>
      <div class="card">
        <h1>Join a meeting</h1>
        <p class="sub">Paste the meeting link, or enter the meeting code.</p>
        <label for="meeting">Meeting link or code</label>
        <input id="meeting" type="text" autocomplete="off" spellcheck="false" placeholder="https://…/r/your-code  ·  or  your-code" />
        <button class="join" id="join">Join meeting</button>
        <div class="err" id="err"></div>
        <div class="foot">
          <span>Hosting a class?</span>
          <button class="link" id="signin">Sign in to host</button>
        </div>
      </div>
      <p class="hint">A meeting-only app — no dashboard. Sign in once to host &amp; annotate.</p>
    </div>
    <script type="module" src="./home.ts"></script>
  </body>
</html>
