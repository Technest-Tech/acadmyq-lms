<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose what to share</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1120;
        --panel: #111a2e;
        --panel-hover: #16223c;
        --border: rgba(148, 163, 184, 0.18);
        --emerald: #34d399;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 18px 22px 10px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }
      .badge[hidden] {
        /* a class selector beats the UA [hidden] rule, so re-assert it explicitly */
        display: none;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 600;
        color: var(--emerald);
        background: rgba(52, 211, 153, 0.12);
        border: 1px solid rgba(52, 211, 153, 0.35);
        border-radius: 999px;
      }
      .sub {
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
      }
      .scroll {
        flex: 1;
        overflow-y: auto;
        padding: 8px 22px 12px;
      }
      .group-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 14px 2px 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .tile {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px;
        cursor: pointer;
        transition:
          background 0.12s,
          border-color 0.12s,
          transform 0.06s;
        text-align: left;
        color: inherit;
        font: inherit;
      }
      .tile:hover {
        background: var(--panel-hover);
        border-color: rgba(52, 211, 153, 0.55);
      }
      .tile:active {
        transform: scale(0.98);
      }
      .thumb {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        border-radius: 8px;
        background: #0a0f1d;
        display: block;
      }
      .name {
        margin-top: 8px;
        font-size: 12.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 12px 22px;
        border-top: 1px solid var(--border);
      }
      button.action {
        padding: 9px 18px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.action:hover {
        background: var(--panel-hover);
      }
      .empty {
        color: var(--muted);
        padding: 40px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Choose what to share</h1>
        <div id="badge" class="badge" hidden>✏️ Annotation on — screens only</div>
        <div id="sub" class="sub"></div>
      </header>
      <div class="scroll" id="scroll"></div>
      <footer>
        <button class="action" id="cancel">Cancel</button>
      </footer>
    </div>
    <script type="module" src="./picker.ts"></script>
  </body>
</html>
